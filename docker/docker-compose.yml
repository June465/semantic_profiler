version: '3.8'

services:
  db:
    image: mysql:8.0 
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: Password
      MYSQL_DATABASE: semantic_profiler_db
      MYSQL_USER: user
      MYSQL_PASSWORD: ouWE@e91!#
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql 
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge