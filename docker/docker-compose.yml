version: '3.8'

services:
  db:
    image: mysql:8.0 
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: Password
      MYSQL_DATABASE: semantic_profiler_db
      MYSQL_USER: user
      MYSQL_PASSWORD: ouWEe91
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql 
    networks:
      - app_network

  backend: 
    build:
      context: ../  
      dockerfile: docker/backend.Dockerfile 
    env_file:
      - ../.env
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    # REMOVE THE HARDCODED SECRETS,
    # BUT KEEP THE DATABASE_URL AS IT REFERS TO ANOTHER SERVICE ('db')
    environment:
      DATABASE_URL: mysql+pymysql://user:ouWEe91@db:3306/semantic_profiler_db
    depends_on:
      - db
    networks:
      - app_network
    volumes: 
      - ./faiss_index_data:/app/faiss_data

  frontend: 
    image: nginx:alpine
    container_name: static_frontend
    ports:
      - "3000:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro 
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  db_data:
  faiss_index_data: 

networks:
  app_network:
    driver: bridge